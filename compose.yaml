# Full local stack: Postgres, Redis, Django (gunicorn), a Celery worker and the
# React bundle behind nginx.
#
#   docker compose up --build          # everything
#   docker compose --profile dev up    # swap the built frontend for Vite HMR
#
# Values come from the root .env file (see .env.example); the defaults after
# ":-" keep the stack runnable with no .env at all.

name: fathom

services:
  db:
    image: postgres:18-alpine
    container_name: fathom_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fathom}
      POSTGRES_USER: ${POSTGRES_USER:-fathom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fathom}
    ports:
      # 5433 on the host so this never collides with a locally installed server.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory, so the mount
      # belongs at /var/lib/postgresql - mounting .../data restart-loops.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fathom} -d ${POSTGRES_DB:-fathom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fathom_redis
    restart: unless-stopped
    # Append-only file so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    image: fathom-backend:local
    container_name: fathom_backend
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-key-change-me}
      PORT: ${PORT:-8000}
      # Service name "db" resolves on the compose network; the port here is the
      # container port (5432), not the published one.
      DATABASE_URL: postgres://${POSTGRES_USER:-fathom}:${POSTGRES_PASSWORD:-fathom}@db:5432/${POSTGRES_DB:-fathom}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # User uploads must outlive the container; the rest of the image is
      # read-only as far as the app is concerned.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Same image as the web service - one build, two roles.
    build:
      context: ./backend
      target: runtime
    image: fathom-backend:local
    container_name: fathom_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-key-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-fathom}:${POSTGRES_PASSWORD:-fathom}@db:5432/${POSTGRES_DB:-fathom}
      REDIS_URL: redis://redis:6379/0
      # Migrations belong to the web service only; two processes racing the
      # same schema is how you get a half-applied migration.
      RUN_MIGRATIONS: "false"
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - media:/app/media
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        # Baked in at build time: Vite inlines VITE_* into the bundle.
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: fathom-frontend:local
    container_name: fathom_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  # ── dev profile ───────────────────────────────────────────────────────────
  # Vite dev server with hot reload, bind-mounted from the host.
  #   docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:24-alpine
    container_name: fathom_frontend_dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the container's node_modules (linux binaries)
      # from being shadowed by the host's (macOS binaries).
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  media:
